<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Traffic Policeman | কুইজ</title>
    <style>
        /* আপনার ওয়েবসাইটের থিম ও কাঠামো */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121826; color: #ffffff; padding: 20px; scroll-behavior: smooth; }
        .quiz-header { position: sticky; top: 0; background: #1c2536; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; margin-bottom: 20px; border-bottom: 3px solid #764ba2; }
        .timer { font-size: 20px; color: #e94560; font-weight: bold; }
        .question-card { background: #1c2536; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-left: 5px solid #764ba2; }
        .q-text { font-size: 18px; margin-bottom: 15px; color: #2ecc71; }
        .option { background: #232d3f; padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; margin-bottom: 8px; border: 1px solid transparent; transition: 0.3s; }
        input[type="radio"] { margin-right: 10px; accent-color: #764ba2; }
        .correct { background: #1b4332 !important; border: 1px solid #2ecc71 !important; color: #fff !important; }
        .wrong { background: #4a1c1c !important; border: 1px solid #e74c3c !important; color: #fff !important; }
        .submit-btn { width: 100%; background: #764ba2; color: white; padding: 15px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #result-summary { display: none; text-align: center; background: #232d3f; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #2ecc71; }
    </style>
</head>
<body>

    <div class="quiz-header" id="top">
        <h3>The Traffic Policeman - Unit 2: Lesson 4</h3>
        <div class="timer" id="timer">25:00</div>
    </div>

    <div id="result-summary">
        <h2>আপনার ফলাফল</h2>
        <div id="scoreDisplay" style="font-size: 28px; margin: 10px 0; color: #2ecc71;"></div>
        <p id="statsDisplay"></p>
        <button class="submit-btn" style="width: auto; padding: 10px 30px;" onclick="location.href='exam_english.html'">ফিরে যান</button>
    </div>

    <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" id="submitBtn" class="submit-btn" onclick="calculateResult()">কুইজ সাবমিট করুন</button>
    </form>

    <script>
        const quizData = [
            { q: "What is the primary duty of a traffic policeman?", a: "Directing vehicles", opts: ["Driving cars", "Directing vehicles", "Selling fuel", "Repairing roads"] },
            { q: "Where does the traffic policeman usually stand?", a: "In the middle of the intersection", opts: ["On the sidewalk", "Under a bridge", "In the middle of the intersection", "In a police station"] },
            { q: "The traffic policeman is exposed to ______ and dust.", a: "Sunlight", opts: ["Air conditioning", "Sunlight", "Music", "Soft wind"] },
            { q: "What does he wear to be seen clearly from a distance?", a: "A bright uniform", opts: ["A black coat", "A bright uniform", "Casual jeans", "A rain jacket only"] },
            { q: "The word 'vigilant' describes him as ______.", a: "Always watchful", opts: ["Very lazy", "Always watchful", "Sleeping", "Careless"] },
            { q: "How does he control the movement of vehicles?", a: "Using hand signals and whistle", opts: ["Using a megaphone", "Using hand signals and whistle", "By shouting", "By waving a flag"] },
            { q: "A traffic policeman's job is often considered ______.", a: "Hazardous to health", opts: ["Very easy", "Hazardous to health", "Part-time", "Luxurious"] },
            { q: "The word 'chaos' means ______.", a: "Complete disorder", opts: ["Perfect order", "Complete disorder", "Quiet place", "Fast speed"] },
            { q: "He ensures the ______ of commuters.", a: "Safety", opts: ["Wealth", "Safety", "Food", "Fashion"] },
            { q: "What does he face during the rainy season?", a: "Rain and mud", opts: ["Snow", "Rain and mud", "Extreme heat", "Dust storms"] },
            { q: "The word 'exhaustion' means ______.", a: "Extreme tiredness", opts: ["Happiness", "Extreme tiredness", "Energy", "Speed"] },
            { q: "He is a ______ of the law on the road.", a: "Representative", opts: ["Violator", "Representative", "Enemy", "Spectator"] },
            { q: "The noise of horns and engines can affect his ______.", a: "Hearing", opts: ["Eyesight", "Hearing", "Smell", "Taste"] },
            { q: "He must remain ______ even in annoying traffic.", a: "Patient", opts: ["Angry", "Patient", "Silent", "Fast"] },
            { q: "The word 'monotonous' refers to his work being ______.", a: "Boringly repetitive", opts: ["Exciting", "Boringly repetitive", "Very short", "Very easy"] },
            { q: "He prevents ______ at busy junctions.", a: "Traffic jams", opts: ["Walking", "Traffic jams", "Shopping", "Singing"] },
            { q: "The word 'agile' means he needs to be ______.", a: "Quick-moving", opts: ["Slow-moving", "Quick-moving", "Heavy", "Old"] },
            { q: "He works while others are ______.", a: "Celebrating holidays", opts: ["Sleeping at night", "Celebrating holidays", "At school", "At home"] },
            { q: "What is 'air pollution's' effect on him?", a: "Respiratory problems", opts: ["Better breathing", "Respiratory problems", "Stronger lungs", "No effect"] },
            { q: "The word 'commuter' refers to ______.", a: "People who travel daily", opts: ["Shopkeepers", "People who travel daily", "Police officers", "Vehicle owners"] },
            { q: "He gives ______ to pedestrians to cross the road.", a: "Permission/Signal", opts: ["Money", "Permission/Signal", "Tickets", "Food"] },
            { q: "The word 'persistent' means ______.", a: "Continuing firmly", opts: ["Giving up", "Continuing firmly", "Stopping often", "Slow"] },
            { q: "His presence on the road is ______.", a: "Indispensable", opts: ["Unnecessary", "Indispensable", "Optional", "Rare"] },
            { q: "The word 'junction' means ______.", a: "Place where roads meet", opts: ["A dead end", "Place where roads meet", "A high hill", "A parking lot"] },
            { q: "He often suffers from ______ due to standing long hours.", a: "Leg pain", opts: ["Headache", "Leg pain", "Earache", "Fever"] },
            { q: "The word 'unpredictable' refers to ______.", a: "Traffic situations", opts: ["His uniform", "Traffic situations", "The road color", "The sun"] },
            { q: "He is a 'silent hero' because his work is ______.", a: "Often overlooked", opts: ["Very noisy", "Often overlooked", "Very famous", "Highly paid"] },
            { q: "The word 'regulate' means ______.", a: "To control", opts: ["To break", "To control", "To ignore", "To speed up"] },
            { q: "He serves the ______ with dedication.", a: "Public", opts: ["Rich only", "Public", "Foreigners only", "Drivers only"] },
            { q: "The overall tone of the text about him is ______.", a: "Appreciative", opts: ["Critical", "Appreciative", "Negative", "Funny"] }
        ];

        const container = document.getElementById('questionsContainer');
        quizData.forEach((data, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <p class="q-text">${index + 1}. ${data.q}</p>
                <div class="options-grid">
                    ${data.opts.map(opt => `
                        <label class="option" id="label-${index}-${opt.replace(/[^a-zA-Z0-9]/g, '')}">
                            <input type="radio" name="q${index}" value="${opt}"> ${opt}
                        </label>
                    `).join('')}
                </div>
            `;
            container.appendChild(card);
        });

        let timeLeft = 25 * 60;
        const timerInterval = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) { clearInterval(timerInterval); calculateResult(); }
            timeLeft--;
        }, 1000);

        function calculateResult() {
            clearInterval(timerInterval);
            let score = 0, correct = 0, wrong = 0, unattempted = 0;

            quizData.forEach((data, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected) {
                    const correctLabel = document.getElementById(`label-${index}-${data.a.replace(/[^a-zA-Z0-9]/g, '')}`);
                    if (selected.value === data.a) {
                        score += 1; correct++;
                        selected.parentElement.classList.add('correct');
                    } else {
                        score -= 0.25; wrong++;
                        selected.parentElement.classList.add('wrong');
                        correctLabel.classList.add('correct');
                    }
                } else { unattempted++; }
                document.getElementsByName(`q${index}`).forEach(i => i.disabled = true);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('result-summary').style.display = 'block';
            document.getElementById('scoreDisplay').innerText = `আপনার মোট স্কোর: ${score.toFixed(2)}`;
            document.getElementById('statsDisplay').innerText = `সঠিক: ${correct} | ভুল: ${wrong} | উত্তর দেননি: ${unattempted}`;
        }
    </script>
</body>
</html>
