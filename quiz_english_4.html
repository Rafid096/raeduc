<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What is a Dream? | কুইজ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121826; color: #ffffff; padding: 20px; scroll-behavior: smooth; }
        .quiz-header { position: sticky; top: 0; background: #1c2536; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; margin-bottom: 20px; border-bottom: 3px solid #764ba2; }
        .timer { font-size: 20px; color: #e94560; font-weight: bold; }
        .question-card { background: #1c2536; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-left: 5px solid #764ba2; }
        .q-text { font-size: 18px; margin-bottom: 15px; color: #2ecc71; }
        .option { background: #232d3f; padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; margin-bottom: 8px; border: 1px solid transparent; transition: 0.3s; }
        input[type="radio"] { margin-right: 10px; accent-color: #764ba2; }
        .correct { background: #1b4332 !important; border: 1px solid #2ecc71 !important; color: #fff !important; }
        .wrong { background: #4a1c1c !important; border: 1px solid #e74c3c !important; color: #fff !important; }
        .submit-btn { width: 100%; background: #764ba2; color: white; padding: 15px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #result-summary { display: none; text-align: center; background: #232d3f; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #2ecc71; }
    </style>
</head>
<body>

    <div class="quiz-header" id="top">
        <h3>What is a Dream? - Unit 2: Lesson 1</h3>
        <div class="timer" id="timer">25:00</div>
    </div>

    <div id="result-summary">
        <h2>আপনার ফলাফল</h2>
        <div id="scoreDisplay" style="font-size: 28px; margin: 10px 0; color: #2ecc71;"></div>
        <p id="statsDisplay"></p>
        <button class="submit-btn" style="width: auto; padding: 10px 30px;" onclick="location.href='exam_english.html'">ফিরে যান</button>
    </div>

    <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" id="submitBtn" class="submit-btn" onclick="calculateResult()">কুইজ সাবমিট করুন</button>
    </form>

    <script>
        const quizData = [
            { q: "Dreams have fascinated ______ for thousands of years.", a: "philosophers", opts: ["scientists", "philosophers", "doctors", "artists"] },
            { q: "Who proposed a famous theory about dreams in the 19th century?", a: "Sigmund Freud", opts: ["Newton", "Einstein", "Sigmund Freud", "Darwin"] },
            { q: "Dreams are a series of ______, emotions, and sensations.", a: "images", opts: ["plans", "images", "words", "noises"] },
            { q: "According to Freud, dreams are a representation of ______.", a: "unconscious desires", opts: ["conscious thoughts", "unconscious desires", "daily work", "future goals"] },
            { q: "Dreams occurring during the ______ sleep are the most vivid.", a: "REM", opts: ["NREM", "Deep", "REM", "Light"] },
            { q: "The word 'vivid' means?", a: "Clear and bright", opts: ["Dull", "Clear and bright", "Blurry", "Boring"] },
            { q: "Some researchers suggest that dreams are a ______ necessity.", a: "biological", opts: ["financial", "biological", "social", "political"] },
            { q: "What does 'fascinate' mean?", a: "Attract strongly", opts: ["Disturb", "Attract strongly", "Ignore", "Scare"] },
            { q: "Dreams help in processing ______.", a: "emotions", opts: ["food", "emotions", "money", "books"] },
            { q: "A nightmare is a ______ dream.", a: "frightening", opts: ["sweet", "frightening", "funny", "short"] },
            { q: "The study of dreams is called ______.", a: "Oneirology", opts: ["Biology", "Oneirology", "Psychology", "Astrology"] },
            { q: "Freud's famous book is titled 'The ______ of Dreams'.", a: "Interpretation", opts: ["Science", "Interpretation", "Meaning", "Secret"] },
            { q: "Dreams can be triggered by ______ stimuli.", a: "external", opts: ["external", "false", "no", "dead"] },
            { q: "The word 'frustrated' refers to feeling ______.", a: "defeated", opts: ["happy", "defeated", "excited", "calm"] },
            { q: "Researchers believe dreams help in consolidating ______.", a: "memory", opts: ["wealth", "memory", "body", "bones"] },
            { q: "What does 'perplexing' mean?", a: "Confusing", opts: ["Simple", "Confusing", "Interesting", "Ugly"] },
            { q: "Some dreams are a way of ______ problems.", a: "solving", opts: ["creating", "solving", "hiding", "forgetting"] },
            { q: "The word 'hallucination' means?", a: "Illusion", opts: ["Truth", "Illusion", "Focus", "Vision"] },
            { q: "Sigmund Freud was an ______ neurologist.", a: "Austrian", opts: ["American", "Austrian", "British", "German"] },
            { q: "Dreams may contain ______ from our waking life.", a: "elements", opts: ["nothing", "elements", "secrets", "lies"] },
            { q: "The term 'REM' stands for ______ Eye Movement.", a: "Rapid", opts: ["Random", "Rapid", "Real", "Rare"] },
            { q: "Dreams are often described as ______.", a: "elusive", opts: ["permanent", "elusive", "logical", "simple"] },
            { q: "The word 'stimulus' means?", a: "Something that causes reaction", opts: ["A dream", "Something that causes reaction", "A fear", "A sleep"] },
            { q: "Dreams can be ______ or terrifying.", a: "joyful", opts: ["joyful", "useless", "noisy", "angry"] },
            { q: "A 'repressed' desire is one that is ______.", a: "held back", opts: ["shown", "held back", "broken", "sold"] },
            { q: "What is the opposite of 'vivid'?", a: "vague", opts: ["bright", "vague", "clear", "strong"] },
            { q: "Dreams may provide a 'safety valve' for ______.", a: "emotions", opts: ["body", "emotions", "steam", "blood"] },
            { q: "Who is the 'father of psychoanalysis'?", a: "Sigmund Freud", opts: ["Jung", "Sigmund Freud", "Watson", "Skinner"] },
            { q: "The word 'conundrum' means?", a: "Puzzle", opts: ["Answer", "Puzzle", "Truth", "Sound"] },
            { q: "Dreaming is a ______ experience.", a: "universal", opts: ["rare", "universal", "fake", "bad"] }
        ];

        const container = document.getElementById('questionsContainer');
        quizData.forEach((data, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <p class="q-text">${index + 1}. ${data.q}</p>
                <div class="options-grid">
                    ${data.opts.map(opt => `
                        <label class="option" id="label-${index}-${opt.replace(/[^a-zA-Z0-9]/g, '')}">
                            <input type="radio" name="q${index}" value="${opt}"> ${opt}
                        </label>
                    `).join('')}
                </div>
            `;
            container.appendChild(card);
        });

        let timeLeft = 25 * 60;
        const timerInterval = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) { clearInterval(timerInterval); calculateResult(); }
            timeLeft--;
        }, 1000);

        function calculateResult() {
            clearInterval(timerInterval);
            let score = 0, correct = 0, wrong = 0, unattempted = 0;

            quizData.forEach((data, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected) {
                    const correctLabel = document.getElementById(`label-${index}-${data.a.replace(/[^a-zA-Z0-9]/g, '')}`);
                    if (selected.value === data.a) {
                        score += 1; correct++;
                        selected.parentElement.classList.add('correct');
                    } else {
                        score -= 0.25; wrong++;
                        selected.parentElement.classList.add('wrong');
                        correctLabel.classList.add('correct');
                    }
                } else { unattempted++; }
                document.getElementsByName(`q${index}`).forEach(i => i.disabled = true);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('result-summary').style.display = 'block';
            document.getElementById('scoreDisplay').innerText = `স্কোর: ${score.toFixed(2)}`;
            document.getElementById('statsDisplay').innerText = `সঠিক: ${correct} | ভুল: ${wrong} | উত্তর দেননি: ${unattempted}`;
        }
    </script>
</body>
</html>
