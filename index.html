<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন | একাডেমিক পোর্টাল</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #121826 0%, #1c2536 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 90%; max-width: 400px; text-align: center; color: #333; }
        .logo-container { width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 50%; border: 3px solid #764ba2; display: flex; justify-content: center; align-items: center; background: #f8f9fa; overflow: hidden; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #34495e; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; outline: none; font-size: 16px; }
        .login-btn { width: 100%; background: #764ba2; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background: #667eea; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-container"><img src="Logo.png" alt="Logo" style="width:100%;"></div>
        <h2>স্বাগতম</h2>
        <p>কুইজ শুরু করতে তথ্য দিন</p>
        <div class="form-group">
            <label>আপনার নাম</label>
            <input type="text" id="userName" placeholder="নাম লিখুন...">
        </div>
        <div class="form-group">
            <label>মোবাইল নম্বর</label>
            <input type="number" id="userPhone" placeholder="০১৭XXXXXXXX">
        </div>
        <button class="login-btn" onclick="login()">তথ্য নিশ্চিত করুন</button>
    </div>

    <script>
        function login() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            if (name.trim() === "" || phone.trim() === "") {
                alert("দয়া করে সঠিক তথ্য দিন!");
                return;
            }
            localStorage.setItem('studentName', name);
            localStorage.setItem('studentPhone', phone);
            window.location.href = "home.html"; // লগইন সফল হলে হোম পেজে যাবে
        }
    </script>
</body>
</html>
