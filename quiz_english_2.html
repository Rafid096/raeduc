<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelson Mandela | কুইজ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121826; color: #ffffff; padding: 20px; scroll-behavior: smooth; }
        .quiz-header { position: sticky; top: 0; background: #1c2536; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; margin-bottom: 20px; border-bottom: 3px solid #764ba2; }
        .timer { font-size: 20px; color: #e94560; font-weight: bold; }
        .question-card { background: #1c2536; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-left: 5px solid #764ba2; }
        .q-text { font-size: 18px; margin-bottom: 15px; color: #2ecc71; }
        .option { background: #232d3f; padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; margin-bottom: 8px; border: 1px solid transparent; transition: 0.3s; }
        input[type="radio"] { margin-right: 10px; accent-color: #764ba2; }
        .correct { background: #1b4332 !important; border: 1px solid #2ecc71 !important; color: #fff !important; }
        .wrong { background: #4a1c1c !important; border: 1px solid #e74c3c !important; color: #fff !important; }
        .submit-btn { width: 100%; background: #764ba2; color: white; padding: 15px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #result-summary { display: none; text-align: center; background: #232d3f; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #2ecc71; }
    </style>
</head>
<body>

    <div class="quiz-header" id="top">
        <h3>Nelson Mandela - Unit 1: Lesson 1</h3>
        <div class="timer" id="timer">25:00</div>
    </div>

    <div id="result-summary">
        <h2>আপনার ফলাফল</h2>
        <div id="scoreDisplay" style="font-size: 28px; margin: 10px 0; color: #2ecc71;"></div>
        <p id="statsDisplay"></p>
        <button class="submit-btn" style="width: auto; padding: 10px 30px;" onclick="location.href='exam_english.html'">ফিরে যান</button>
    </div>

    <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" id="submitBtn" class="submit-btn" onclick="calculateResult()">কুইজ সাবমিট করুন</button>
    </form>

    <script>
        const quizData = [
            { q: "How long did Mandela spend behind bars?", a: "Nearly three decades", opts: ["Ten years", "Twenty years", "Nearly three decades", "Thirty-five years"] },
            { q: "What does the word 'apartheid' refer to?", a: "Racial segregation", opts: ["Political unity", "Racial segregation", "Economic freedom", "Religious harmony"] },
            { q: "When did Mandela receive the Nobel Peace Prize?", a: "1993", opts: ["1990", "1993", "1994", "1999"] },
            { q: "Mandela was the first ______ President of South Africa.", a: "Black", opts: ["White", "Black", "Interim", "European"] },
            { q: "Who did Mandela share his Nobel Peace Prize with?", a: "F.W. de Klerk", opts: ["Desmond Tutu", "F.W. de Klerk", "Barack Obama", "Kofi Annan"] },
            { q: "What does 'embody' mean?", a: "Represent", opts: ["Avoid", "Represent", "Disguise", "Argue"] },
            { q: "Mandela guided South Africa from multi-racial democracy to ______.", a: "A peaceful transition", opts: ["Civil war", "A peaceful transition", "Autocracy", "Communism"] },
            { q: "The word 'reconciliation' means?", a: "Restoration of friendly relations", opts: ["Conflict", "Restoration of friendly relations", "Separation", "Boycott"] },
            { q: "Mandela left public life in ______.", a: "2004", opts: ["1999", "2004", "2010", "2013"] },
            { q: "What was Mandela's clan name?", a: "Madiba", opts: ["Tutu", "Madiba", "Zulu", "Xhosa"] },
            { q: "Mandela was charged with ______ in the Rivonia Trial.", opts: ["Theft", "Treason", "Murder", "Assault"], a: "Treason" },
            { q: "The word 'manifestation' means?", a: "Sign", opts: ["Sign", "Confusion", "Secret", "Fear"] },
            { q: "South Africans revered Mandela as the 'Father of the ______'.", a: "Nation", opts: ["People", "Nation", "Politics", "Movement"] },
            { q: "Apartheid was a ______ system.", a: "Discriminatory", opts: ["Fair", "Democratic", "Discriminatory", "Religious"] },
            { q: "Mandela fought against ______ domination.", a: "White", opts: ["White", "Black", "Foreign", "Economic"] },
            { q: "What was Mandela's 'ideal'?", a: "A democratic and free society", opts: ["Wealth", "Power", "A democratic and free society", "War"] },
            { q: "The word 'stature' refers to ______.", a: "Reputation", opts: ["Height", "Reputation", "Money", "Fear"] },
            { q: "Mandela became a symbol of ______.", a: "Justice", opts: ["Hate", "Justice", "Division", "Royalty"] },
            { q: "When was the Rivonia Trial held?", a: "1963-64", opts: ["1952-53", "1963-64", "1990-91", "1948-49"] },
            { q: "What did Mandela never lose during imprisonment?", a: "His resolve", opts: ["His wealth", "His resolve", "His house", "His anger"] },
            { q: "Mandela was a ______ for peace.", a: "Beacon", opts: ["Beacon", "Barrier", "Enemy", "Spectator"] },
            { q: "The word 'shackle' means?", a: "Chain", opts: ["Unlock", "Chain", "Gift", "Support"] },
            { q: "Mandela spent ______ years in prison.", a: "27", opts: ["10", "27", "30", "18"] },
            { q: "Mandela's life was a struggle against ______.", a: "Racism", opts: ["Poverty", "Racism", "Nature", "Illiteracy"] },
            { q: "What does 'negotiate' mean?", a: "Discuss terms", opts: ["Refuse", "Discuss terms", "Fight", "Ignore"] },
            { q: "Mandela's message was one of ______.", a: "Hope", opts: ["Despair", "Hope", "Revenge", "Greed"] },
            { q: "Who called Mandela a 'global icon'?", a: "The world", opts: ["Only Africans", "The world", "His family", "His enemies"] },
            { q: "The word 'myth' means?", a: "Legend", opts: ["Fact", "Legend", "Truth", "News"] },
            { q: "Mandela was a 'proponent' of equality. What is 'proponent'?", a: "Supporter", opts: ["Opponent", "Supporter", "Hater", "Killer"] },
            { q: "When did Mandela die?", a: "2013", opts: ["2010", "2013", "2015", "2004"] }
        ];

        const container = document.getElementById('questionsContainer');
        quizData.forEach((data, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <p class="q-text">${index + 1}. ${data.q}</p>
                <div class="options-grid" id="options-${index}">
                    ${data.opts.map(opt => `
                        <label class="option" id="label-${index}-${opt.replace(/[^a-zA-Z0-9]/g, '')}">
                            <input type="radio" name="q${index}" value="${opt}"> ${opt}
                        </label>
                    `).join('')}
                </div>
            `;
            container.appendChild(card);
        });

        let timeLeft = 25 * 60;
        const timerInterval = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) { clearInterval(timerInterval); calculateResult(); }
            timeLeft--;
        }, 1000);

        function calculateResult() {
            clearInterval(timerInterval);
            let score = 0, correct = 0, wrong = 0, unattempted = 0;

            quizData.forEach((data, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected) {
                    const correctLabel = document.getElementById(`label-${index}-${data.a.replace(/[^a-zA-Z0-9]/g, '')}`);
                    if (selected.value === data.a) {
                        score += 1; correct++;
                        selected.parentElement.classList.add('correct');
                    } else {
                        score -= 0.25; wrong++;
                        selected.parentElement.classList.add('wrong');
                        correctLabel.classList.add('correct');
                    }
                } else {
                    unattempted++;
                }
                document.getElementsByName(`q${index}`).forEach(i => i.disabled = true);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('result-summary').style.display = 'block';
            document.getElementById('scoreDisplay').innerText = `স্কোর: ${score.toFixed(2)}`;
            document.getElementById('statsDisplay').innerText = `সঠিক: ${correct} | ভুল: ${wrong} | উত্তর দেননি: ${unattempted}`;
        }
    </script>
</body>
</html>
