<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হোম | একাডেমিক পোর্টাল</title>
    <style>
        /* আপনার অরিজিনাল index.html এর CSS এখানে দিন */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121826; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        nav { padding: 20px 5%; background: #121826; display: flex; justify-content: space-between; align-items: center; }
        .user-info-nav { background: #232d3f; padding: 8px 15px; border-radius: 50px; color: #2ecc71; font-weight: bold; font-size: 14px; }
        .subject-container { padding: 20px 5%; display: flex; flex-direction: column; gap: 20px; }
        .subject-card { background: #ffffff; padding: 30px; border-radius: 20px; text-align: center; color: #333; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .footer { background-color: #0f141e; text-align: center; padding: 30px 20px; margin-top: auto; }
    </style>
</head>
<body>
    <nav>
        <div class="user-info-nav">👤 <span id="nav-user-name">ইউজার</span></div>
        <a href="profile.html" style="color:white; text-decoration:none;">প্রোফাইল</a>
    </nav>

    <div style="text-align:center; padding: 20px;">
        <h2 id="welcome-msg">পরীক্ষা শুরু করুন</h2>
    </div>

    <div class="subject-container">
        <div class="subject-card" onclick="location.href='exam_bengali.html'">
            <h3>📚 বাংলা কুইজ</h3>
            <p>অধ্যায়ভিত্তিক ৫০টি গুরুত্বপূর্ণ প্রশ্নের সেট।</p>
        </div>
        <div class="subject-card">
            <h3>✍️ ইংরেজি কুইজ</h3>
            <p>শীঘ্রই আসছে...</p>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 ACADEMIC PORTAL</p>
    </footer>

    <script>
        window.onload = function() {
            const name = localStorage.getItem('studentName');
            if (!name) {
                window.location.href = "index.html"; // লগইন না থাকলে ফেরত পাঠাবে
            } else {
                document.getElementById('nav-user-name').innerText = name;
                document.getElementById('welcome-msg').innerText = "স্বাগতম, " + name + "!";
            }
        };
    </script>
</body>
</html>
